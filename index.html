<script>
(function () {
  var KEY = 'publish-lock', form = document.getElementById('f');
  function norm(w) { return w.normalize('NFKC').toLowerCase().replace(/\s+/g, ''); }
  function seed(w) {
    var u = new TextEncoder().encode(w), h = 2166136261;
    for (var i = 0; i < u.length; i++) h = Math.imul(h ^ u[i], 16777619) >>> 0;
    return h || 1;
  }
  function unlock(D, w) {
    var s = atob(D), n = s.length, b = new Uint8Array(n), x = seed(w);
    for (var i = 0; i < n; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      b[i] = s.charCodeAt(i) ^ (x & 255);
    }
    var t = new TextDecoder('utf-8').decode(b);
    return t.indexOf('PUBLISH-OK\n') === 0 ? t.slice(11) : null;
  }
  // 目次へ差し替える。読み込みの途中で差し替えると、入力欄が残ったまま、その下に目次が足されるので、読み込みが終わってからやる
  function show(h) {
    var go = function () { document.open(); document.write(h); document.close(); };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
  }
  // 覚えられた古い入口が出た時のために、開いた時に入口を取り直して、新しい目次を使う。取れなければ、いま在る物を使う
  var ready = fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) { var e = t && new DOMParser().parseFromString(t, 'text/html').getElementById('d'); return e ? e.textContent : null; })
    .catch(function () { return null; })
    .then(function (d) { return (d || document.getElementById('d').textContent).replace(/\s+/g, ''); });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) form.style.display = 'none';   // 覚えたパスワードが在る間は、入力の画面を見せない（合わなければ、後で出す）
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var w = norm(document.getElementById('p').value);
    ready.then(function (D) {
      var h = unlock(D, w);
      if (h) { try { localStorage.setItem(KEY, w); } catch (e) {} show(h); }
      else { document.getElementById('m').textContent = 'パスワードが違います。'; }
    });
  });
  ready.then(function (D) {
    var h0 = saved ? unlock(D, saved) : null;
    if (h0) show(h0); else form.style.display = '';
  });
})();
