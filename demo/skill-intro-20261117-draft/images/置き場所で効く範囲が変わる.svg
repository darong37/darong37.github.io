<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" width="660" height="620" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <defs><marker id="ok" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2a78d6"/></marker></defs>
  <rect x="16" y="16" width="628" height="588" rx="16" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="36" y="56" font-size="24" font-weight="700" fill="#1d2330">自分の全部のプロジェクト</text>
  <text x="36" y="84" font-size="16" fill="#5b6475">ホームの下に置いたスキル</text>
  <rect x="350" y="34" width="290" height="64" rx="10" fill="#fff6d6" stroke="#e0a800" stroke-width="3"/>
  <text x="495" y="62" font-size="18" font-weight="700" fill="#1d2330" text-anchor="middle">スキル X（~/.claude/skills/）</text>
  <text x="495" y="86" font-size="16" fill="#5b6475" text-anchor="middle">全部のリポジトリに効く</text>
  <rect x="40" y="200" width="270" height="380" rx="12" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <text x="58" y="236" font-size="24" font-weight="700" fill="#1d2330">リポジトリ A</text>
  <text x="58" y="262" font-size="16" fill="#5b6475" font-family="Menlo, monospace">.claude/skills/</text>
  <rect x="62" y="300" width="226" height="64" rx="10" fill="#e9f6ec" stroke="#2a8a45" stroke-width="3"/>
  <text x="175" y="328" font-size="20" font-weight="700" fill="#1d2330" text-anchor="middle">スキル Y</text>
  <text x="175" y="352" font-size="16" fill="#5b6475" text-anchor="middle">A の中だけに効く</text>
  <text x="175" y="430" font-size="20" fill="#1d2330" text-anchor="middle">X も Y も効く</text>
  <rect x="350" y="200" width="270" height="380" rx="12" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <text x="368" y="236" font-size="24" font-weight="700" fill="#1d2330">リポジトリ B</text>
  <text x="485" y="430" font-size="20" fill="#1d2330" text-anchor="middle">X だけ効く</text>
  <text x="485" y="460" font-size="20" font-weight="700" fill="#d03b3b" text-anchor="middle">Y は効かない ×</text>
  <path d="M440 98 L200 196" stroke="#2a78d6" stroke-width="4" fill="none" marker-end="url(#ok)"/>
  <path d="M520 98 L500 196" stroke="#2a78d6" stroke-width="4" fill="none" marker-end="url(#ok)"/>
